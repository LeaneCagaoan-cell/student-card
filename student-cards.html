<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #fce4ec;
            padding: 2rem;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: #fff3e0;
            border: 3px solid #f8bbd0;
            border-radius: 16px;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #212121;
        }

        .divider {
            height: 2px;
            background: linear-gradient(to right, #f8bbd0, #f48fb1, #f8bbd0);
            margin-bottom: 2rem;
        }

        .card {
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
            border-radius: 8px;
            border: 2px solid #424242;
        }

        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .card p {
            font-size: 1rem;
            margin-bottom: 0.3rem;
            color: #333333;
        }

        /* Alternating colors */
        .card.purple {
            background-color: #b39ddb;
        }

        .card.pink {
            background-color: #f8cdd8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Profile Cards</h1>
        <div class="divider"></div>

        <!-- Card 1 -->
        <div class="card purple">
            <h2>Honey Leane Cagoan</h2>
            <p>Student ID: 12133201</p>
            <p>Program: BSIT</p>
        </div>

        <!-- Card 2 -->
        <div class="card pink">
            <h2>Maria Santos</h2>
            <p>Student ID: 12133202</p>
            <p>Program: BSCS</p>
        </div>

        <!-- Card 3 -->
        <div class="card purple">
            <h2>John Reyes</h2>
            <p>Student ID: 12133203</p>
            <p>Program: BSIS</p>
        </div>

        <!-- Card 4 -->
        <div class="card pink">
            <h2>Beatrice Dizon</h2>
            <p>Student ID: 12133204</p>
            <p>Program: BSIT</p>
        </div>

        <!-- Card 5 -->
        <div class="card purple">
            <h2>Lucas Mendoza</h2>
            <p>Student ID: 12133205</p>
            <p>Program: BSCS</p>
        </div>

    </div>

</body>
</html>
